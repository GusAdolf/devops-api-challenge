name: CI/CD

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      version:
        description: "Version/tag to deploy"
        required: false

env:
  IMAGE_REPOSITORY: devops-api-challenge

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Static analysis
        run: ruff check .

      - name: Tests with coverage
        run: pytest

      - name: Docker build
        run: docker build -t "devops-api:${{ github.sha }}" .

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_NAME="$(echo "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          docker tag "devops-api:${{ github.sha }}" "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:${{ github.sha }}"

          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            docker tag "devops-api:${{ github.sha }}" "$IMAGE_NAME:latest"
            docker push "$IMAGE_NAME:latest"
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag "devops-api:${{ github.sha }}" "$IMAGE_NAME:${{ github.ref_name }}"
            docker push "$IMAGE_NAME:${{ github.ref_name }}"
          fi

  deploy:
    name: Deploy
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment: ${{ github.event.inputs.environment || 'production' }}
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      DEVOPS_JWT_SECRET: ${{ secrets.DEVOPS_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Select version
        id: version
        run: echo "value=${{ github.event.inputs.version || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Skip deploy when Oracle secrets are missing
        if: env.ORACLE_HOST == '' || env.ORACLE_USER == '' || env.ORACLE_SSH_KEY == '' || env.DEVOPS_JWT_SECRET == ''
        run: echo "Oracle deploy secrets are not configured. Skipping remote deployment."

      - name: Prepare SSH key
        if: env.ORACLE_HOST != '' && env.ORACLE_USER != '' && env.ORACLE_SSH_KEY != '' && env.DEVOPS_JWT_SECRET != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh-keyscan -T 20 -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Copy deployment files
        if: env.ORACLE_HOST != '' && env.ORACLE_USER != '' && env.ORACLE_SSH_KEY != '' && env.DEVOPS_JWT_SECRET != ''
        run: |
          ssh -o ConnectTimeout=20 -i ~/.ssh/oracle.key "$ORACLE_USER@$ORACLE_HOST" "mkdir -p ~/devops-api"
          scp -o ConnectTimeout=20 -i ~/.ssh/oracle.key docker-compose.prod.yml "$ORACLE_USER@$ORACLE_HOST:~/devops-api/docker-compose.yml"
          scp -o ConnectTimeout=20 -i ~/.ssh/oracle.key infra/nginx/nginx.conf "$ORACLE_USER@$ORACLE_HOST:~/devops-api/nginx.conf"

      - name: Deploy to Oracle VM
        if: env.ORACLE_HOST != '' && env.ORACLE_USER != '' && env.ORACLE_SSH_KEY != '' && env.DEVOPS_JWT_SECRET != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DEVOPS_API_KEY: 2f5ae96c-b558-4c7b-a590-a501ae1c3f6c
          IMAGE_TAG: latest
        run: |
          IMAGE_NAME="$(echo "${DOCKERHUB_USERNAME}/${IMAGE_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          ssh -o ConnectTimeout=20 -i ~/.ssh/oracle.key "$ORACLE_USER@$ORACLE_HOST" \
            "cd ~/devops-api && \
             IMAGE_NAME='${IMAGE_NAME}' \
             IMAGE_TAG='${IMAGE_TAG}' \
             DEVOPS_API_KEY='${DEVOPS_API_KEY}' \
             DEVOPS_JWT_SECRET='${DEVOPS_JWT_SECRET}' \
             docker compose pull && \
             IMAGE_NAME='${IMAGE_NAME}' \
             IMAGE_TAG='${IMAGE_TAG}' \
             DEVOPS_API_KEY='${DEVOPS_API_KEY}' \
             DEVOPS_JWT_SECRET='${DEVOPS_JWT_SECRET}' \
             docker compose up -d"

      - name: Deployment summary
        if: env.ORACLE_HOST != '' && env.ORACLE_USER != '' && env.ORACLE_SSH_KEY != '' && env.DEVOPS_JWT_SECRET != ''
        run: echo "Application URL: http://$ORACLE_HOST/DevOps"
