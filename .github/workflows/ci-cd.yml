name: CI/CD

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      version:
        description: "Version/tag to deploy"
        required: false

env:
  IMAGE_REPOSITORY: devops-api-challenge

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Static analysis
        run: ruff check .

      - name: Tests with coverage
        run: pytest

      - name: Docker build
        run: docker build -t "devops-api:${{ github.sha }}" .

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_NAME="$(echo "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          docker tag "devops-api:${{ github.sha }}" "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:${{ github.sha }}"

          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            docker tag "devops-api:${{ github.sha }}" "$IMAGE_NAME:latest"
            docker push "$IMAGE_NAME:latest"
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag "devops-api:${{ github.sha }}" "$IMAGE_NAME:${{ github.ref_name }}"
            docker push "$IMAGE_NAME:${{ github.ref_name }}"
          fi

  deploy:
    name: Deploy
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - branch: main
            environment: production
          - branch: master
            environment: production
    environment: ${{ github.event.inputs.environment || matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Select version
        id: version
        run: echo "value=${{ github.event.inputs.version || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Deploy placeholder
        run: |
          IMAGE_NAME="$(echo "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "Deploying $IMAGE_NAME:${{ steps.version.outputs.value }}"
          echo "Configure cloud credentials and apply infra/k8s manifests here."
